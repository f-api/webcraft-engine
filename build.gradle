plugins { id 'java-library' }
group = 'io.github.f-api'
version = '2.2.2'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

repositories { mavenCentral() }
dependencies {
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'tools.jackson.core:jackson-databind'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.springframework:spring-tx'
    compileOnly 'org.springframework.boot:spring-boot'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-starter-websocket'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.slf4j:slf4j-api'
}

def producerResources = layout.buildDirectory.dir('producer-resources')
tasks.register('prepareProducerBundle') {
    def archive = producerResources.map { it.file('generation-producers/runtime.zip') }
    outputs.file(archive)
    doLast {
        def destination = archive.get().asFile
        destination.parentFile.mkdirs()
        def connection = URI.create('https://github.com/f-api/webcraft-engine/releases/download/v1.1.0/webcraft-producer-1.1.0.zip').toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 180000
        def temporary = new File(destination.parentFile, 'runtime.zip.download')
        try {
            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { output -> output << input }
            }
            def hash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(temporary.bytes).encodeHex().toString()
            if (hash != 'abdfa334ea533f85172b437bc11b9340a7735d896817ce8ec6e17632c6aee6f7') throw new GradleException('Producer archive checksum mismatch')
            java.nio.file.Files.move(temporary.toPath(), destination.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally { temporary.delete() }
    }
}
def adapterResources = layout.buildDirectory.dir('worker-adapter-resources')
tasks.register('prepareWorkerAdapter', Exec) {
    dependsOn tasks.named('prepareProducerBundle')
    def compiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    inputs.files(fileTree('src/main/java/com/gameexpert/authority/versioned/worker') { include '*.java' })
    inputs.file('scripts/package-worker-adapter.py')
    inputs.file('src/main/resources/generation-producers/current-worker.properties')
    inputs.file(producerResources.map { it.file('generation-producers/runtime.zip') })
    inputs.property('compiler', compiler.map { it.metadata.installationPath.asFile.absolutePath })
    outputs.dir(adapterResources)
    doFirst {
        adapterResources.get().asFile.mkdirs()
        commandLine 'python3', '-I', '-B', file('scripts/package-worker-adapter.py'), projectDir,
            producerResources.get().file('generation-producers/runtime.zip').asFile,
            compiler.get().executablePath.asFile,
            adapterResources.get().dir('generation-producers').asFile
    }
}
sourceSets.main.resources.srcDir(adapterResources)
tasks.named('processResources') { dependsOn tasks.named('prepareWorkerAdapter') }
sourceSets.main.resources.srcDir(producerResources)
tasks.named('processResources') { dependsOn tasks.named('prepareProducerBundle') }

def verificationClasses = layout.buildDirectory.dir('verification/classes')
tasks.register('compileProducerVerification', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('verification') { include '*.java' }
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDirectory = verificationClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 21
}
tasks.register('verifyProducerBundle', JavaExec) {
    dependsOn tasks.named('compileProducerVerification'), tasks.named('jar')
    classpath = files(verificationClasses, tasks.named('jar').flatMap { it.archiveFile })
    mainClass = 'com.gameexpert.authority.versioned.ProducerBundleSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    jvmArgs '-Duser.home=' + layout.buildDirectory.dir('verification/home').get().asFile.absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyProducerBundle') }

tasks.register('verifyDefaults', JavaExec) {
    dependsOn tasks.named('compileProducerVerification'), tasks.named('jar')
    classpath = files(verificationClasses, tasks.named('jar').flatMap { it.archiveFile }) + configurations.compileClasspath
    mainClass = 'DefaultsSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyDefaults') }

tasks.named('sourcesJar') {
    dependsOn tasks.named('prepareProducerBundle'), tasks.named('prepareWorkerAdapter')
    include '**/*.java'
}


def componentResources = layout.buildDirectory.dir('component-resources')
tasks.register('generateComponentIndex') {
    inputs.files(sourceSets.main.allJava)
    def index = componentResources.map { it.file('META-INF/webcraft-components.txt') }
    outputs.file(index)
    doLast {
        def components = sourceSets.main.allJava.files.findAll { source ->
            source.text =~ /(?m)^@(Component|Service|Configuration|RestController|Controller|Repository)(\s|\(|$)/
        }.collect { source ->
            def packageName = (source.text =~ /package\s+([\w.]+);/)[0][1]
            packageName + '.' + source.name.replace('.java', '')
        }.sort()
        def target = index.get().asFile
        target.parentFile.mkdirs()
        target.text = components.join('\n') + '\n'
    }
}
sourceSets.main.resources.srcDir(componentResources)
tasks.named('processResources') { dependsOn tasks.named('generateComponentIndex') }
tasks.named('sourcesJar') { dependsOn tasks.named('generateComponentIndex') }


tasks.register('verifyAssignmentSupport', JavaExec) {
    dependsOn tasks.named('compileProducerVerification'), tasks.named('jar')
    classpath = files(verificationClasses, tasks.named('jar').flatMap { it.archiveFile }) + configurations.compileClasspath
    mainClass = 'com.gameexpert.ws.AssignmentSupportSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyAssignmentSupport') }


tasks.register('verifyMoveExtraction', JavaExec) {
    dependsOn tasks.named('compileProducerVerification'), tasks.named('jar')
    classpath = files(verificationClasses, tasks.named('jar').flatMap { it.archiveFile }) + configurations.compileClasspath
    mainClass = 'com.gameexpert.ws.handler.MoveFieldsSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyMoveExtraction') }

tasks.register('verifyClusterWire', JavaExec) {
    dependsOn tasks.named('compileProducerVerification')
    classpath = files(verificationClasses, sourceSets.main.output, configurations.compileClasspath)
    mainClass = 'com.gameexpert.cluster.ClusterWireVerification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += configurations.compileClasspath
tasks.named('test') {
    useJUnitPlatform()
    classpath += configurations.compileClasspath
}
